# =============================================================================
#  ΡΥΘΜΙΣΕΙΣ ΒΡΑΧΙΟΝΑ: ABB GoFa 12 (CRB 15000-12/1.27) - ΠΡΟΤΥΠΟ ΠΡΟΣ ΣΥΜΠΛΗΡΩΣΗ
# -----------------------------------------------------------------------------
#  !!! ΔΕΝ ΕΧΕΙ ΔΟΚΙΜΑΣΤΕΙ. Οι τιμές με «ΕΠΙΒΕΒΑΙΩΣΕ» ή «ΜΕΤΡΗΣΕ» είναι
#  αφετηρία, όχι σωστές τιμές. Αναλυτικές οδηγίες: PORTING_GOFA12.md
#
#  Χρήση:
#    ros2 launch <launch_του_gofa> robot_config:=/πλήρες/path/gofa12.yaml
#  Στην εκκίνηση ο κόμβος τυπώνει τις τιμές που φόρτωσε - έλεγξέ τες.
#  Άγνωστο κλειδί = ο κόμβος ΣΤΑΜΑΤΑ με σφάλμα (προστασία από τυπογραφικά).
# =============================================================================
robot_name: "ABB GoFa 12 (CRB 15000-12/1.27)"

# --- ονόματα από το URDF / SRDF του GoFa ---------------------------------------
# ΕΠΙΒΕΒΑΙΩΣΕ:  grep -o 'group name="[^"]*"' <moveit_config_gofa>/config/*.srdf
planning_group: manipulator
# Αν στο URDF του GoFa κρατήσεις τα ΙΔΙΑ ονόματα κάμερας με τον UR5e
# (gemini_camera_link / gemini_camera_link_optical), ο ανιχνευτής δουλεύει
# χωρίς αλλαγή - δες PORTING_GOFA12.md §2.2.
# ΕΠΙΒΕΒΑΙΩΣΕ με:  ros2 run tf2_tools view_frames   (το frame της κάμερας στο
# άκρο, με +X προς τη θέαση - ΟΧΙ το *_optical)
camera_link: gemini_camera_link
base_frame: base_link

# ΕΠΙΒΕΒΑΙΩΣΕ τα ονόματα από το URDF (grep '<link name' <urdf>). Στα πακέτα
# ROS-Industrial της ABB συνήθως: base_link, link_1 ... link_6, flange, tool0.
# Βάλε με τη σειρά από τον ώμο ως το στήριγμα της κάμερας/εργαλείου.
self_links: [link_1, link_2, link_3, link_4, link_5, link_6, tool0]
# ΜΕΤΡΗΣΕ από τα collision meshes: μισό πάχος του χοντρότερου συνδέσμου.
link_radius: 0.08

# --- εμβέλεια -----------------------------------------------------------------
# Ονομαστική εμβέλεια GoFa 12: 1.27 m (ως τη φλάντζα). Η κάμερα προσθέτει τη
# δική της απόσταση. ΜΕΤΡΗΣΕ τη μέγιστη απόσταση κάμερας-βάσης όπως έγινε στον
# UR5e (εκεί 0.85 ονομαστική -> 0.93 μετρημένη). Ξεκίνα συντηρητικά.
max_reach: 1.25
min_reach: 0.30
# Ως πόσο μακριά από τη βάση δεχόμαστε βαλίτσα ως στόχο. ΡΥΘΜΙΣΕ στον χώρο.
workable_dist: 1.10

# --- κινηματική ---------------------------------------------------------------
ik_timeout: 0.05       # ο IK solver του GoFa μπορεί να θέλει λίγο περισσότερο
small_move_deg: 30
settle: 1.5            # πραγματικός βραχίονας: αναμονή να σταθεροποιηθεί η εικόνα

# --- κάμερα: ΑΝ είναι η ίδια Gemini, μένουν ίδιες --------------------------------
camera_hfov: 1.64
camera_width: 1280
camera_height: 800

# --- θέσεις επιτήρησης: ΠΡΕΠΕΙ ΝΑ ΞΑΝΑΜΕΤΡΗΘΟΥΝ --------------------------------
# [[θέση κάμερας], [σημείο που κοιτάζει]] στο base_frame. Οι τιμές εδώ είναι
# του UR5e: ισχύουν ΜΟΝΟ αν ο GoFa στέκεται στο ίδιο σημείο ως προς τον
# διάδρομο. Τρόπος: βάλε τον βραχίονα με το teach pendant σε θέση που βλέπει
# τον διάδρομο και διάβασε τη θέση της κάμερας:
#   ros2 run tf2_ros tf2_echo base_link camera_link
watch_forward:
  - [[0.00, 0.24, 0.58], [0.00, 0.85, 0.10]]
  - [[0.05, 0.28, 0.54], [0.05, 0.85, 0.12]]
  - [[-0.05, 0.26, 0.60], [-0.05, 0.85, 0.10]]
watch_right:
  - [[0.16, 0.28, 0.56], [0.85, 0.66, 0.12]]
  - [[0.22, 0.24, 0.52], [0.95, 0.62, 0.14]]
  - [[0.10, 0.30, 0.60], [0.75, 0.70, 0.12]]

# --- αποστάσεις θέασης: μένουν ίδιες (εξαρτώνται από κάμερα/tag, όχι βραχίονα) --
face_views: [[0.28, 20.0], [0.24, 35.0], [0.32, 12.0], [0.22, 50.0]]
elevate_views: [[0.28, 0.38], [0.22, 0.30], [0.34, 0.40], [0.18, 0.26]]
handle_standoffs: [0.26, 0.20, 0.32]
