# =============================================================================
#  ΡΥΘΜΙΣΕΙΣ ΒΡΑΧΙΟΝΑ: UR5e (προσομοίωση Gazebo) - ΟΙ ΤΙΜΕΣ ΠΟΥ ΔΟΥΛΕΥΟΥΝ ΤΩΡΑ
# -----------------------------------------------------------------------------
#  Είναι ΑΚΡΙΒΩΣ οι προεπιλογές του move_arm3.py. Χωρίς robot_config ο κώδικας
#  δουλεύει ήδη έτσι - αυτό το αρχείο υπάρχει ως ΠΑΡΑΔΕΙΓΜΑ / αφετηρία για
#  άλλο βραχίονα (δες gofa12.yaml).
#
#  Χρήση:
#    ros2 launch my_ur5e_controller run_move_arm3.launch.py \
#         robot_config:=$(ros2 pkg prefix my_ur5e_controller)/share/my_ur5e_controller/config/ur5e.yaml
#
#  Μονάδες: μέτρα, δευτερόλεπτα, ακτίνια (εκτός αν γράφει _deg).
#  Όλες οι θέσεις είναι στο frame βάσης (base_frame).
# =============================================================================
robot_name: "UR5e (προσομοίωση)"

# --- ονόματα από το URDF / SRDF -----------------------------------------------
planning_group: ur_manipulator        # <group name="..."> στο SRDF
camera_link: gemini_camera_link       # frame της κάμερας (+X = θέαση, ΟΧΙ optical)
base_frame: base_link                 # frame όλων των συντεταγμένων

# Σύνδεσμοι από τη βάση προς την κάμερα, με τη σειρά. Ο έλεγχος αυτο-απόκρυψης
# τους ενώνει με ευθείες και ελέγχει αν μπαίνουν στο κάδρο της κάμερας.
self_links: [shoulder_link, upper_arm_link, forearm_link,
             wrist_1_link, wrist_2_link, wrist_3_link, gripper_link]
link_radius: 0.075                    # μισό πάχος συνδέσμου (UR5e ~13-15cm διάμετρος)

# --- εμβέλεια -----------------------------------------------------------------
max_reach: 0.93        # μέγιστη απόσταση ΚΑΜΕΡΑΣ από τη βάση (μετρημένη 0.92-0.93)
min_reach: 0.22        # πιο κοντά από αυτό ο βραχίονας διπλώνει πάνω του
workable_dist: 0.85    # βαλίτσες πιο μακριά από αυτό αγνοούνται

# --- κινηματική ---------------------------------------------------------------
ik_timeout: 0.03       # s ανά προσπάθεια IK (KDL)
small_move_deg: 30     # λύση IK με κάθε άρθρωση < 30° -> κρατιέται αμέσως (όχι σβούρα)
settle: 0.7            # s αναμονή μετά την κίνηση (πραγματικός βραχίονας: περισσότερο)

# --- κάμερα (Orbbec Gemini, όπως στο xacro) -----------------------------------
camera_hfov: 1.64      # rad, οριζόντιο οπτικό πεδίο
camera_width: 1280
camera_height: 800

# --- θέσεις επιτήρησης: [[θέση κάμερας], [σημείο που κοιτάζει]] --------------
# Εξαρτώνται από το ΠΟΥ στέκεται ο βραχίονας ως προς τον διάδρομο.
watch_forward:
  - [[0.00, 0.24, 0.58], [0.00, 0.85, 0.10]]
  - [[0.05, 0.28, 0.54], [0.05, 0.85, 0.12]]
  - [[-0.05, 0.26, 0.60], [-0.05, 0.85, 0.10]]
watch_right:
  - [[0.16, 0.28, 0.56], [0.85, 0.66, 0.12]]
  - [[0.22, 0.24, 0.52], [0.95, 0.62, 0.14]]
  - [[0.10, 0.30, 0.60], [0.75, 0.70, 0.12]]

# --- αποστάσεις θέασης (ρυθμισμένες στην εμβέλεια του UR5e) -----------------
face_views: [[0.28, 20.0], [0.24, 35.0], [0.32, 12.0], [0.22, 50.0]]   # [απόσταση από πλευρά, ύψος°]
elevate_views: [[0.28, 0.38], [0.22, 0.30], [0.34, 0.40], [0.18, 0.26]] # ευρύ πλάνο: [πίσω, πάνω]
handle_standoffs: [0.26, 0.20, 0.32]                                    # απόσταση από το tag προορισμού
